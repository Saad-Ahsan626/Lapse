name: lapse
description: "Lapse — subscription & free-trial tracker. Cancel before it charges."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.0+3
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/catalog/
    - assets/logos/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
